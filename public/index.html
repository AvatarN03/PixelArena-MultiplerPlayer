<html>

<head>
  <title>PixelArena - Online Shooting Game</title>
  <link rel="shortcut icon" href="./img/pixelarena_logo.svg" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@500;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      margin: 0;
      background: #C85C50;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(174, 0, 0, .6), rgba(80, 0, 0, .6)),
        linear-gradient(90deg, rgba(174, 0, 0, .6), rgba(80, 0, 0, .6));
      background-size: 80px 80px;
    }

    input::placeholder {
      color: #94a3b8;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-image: url("/img/fancy-cushion.png");
    }

    .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: yellow;
      letter-spacing: 3px;
    }

    .top-bar,
    #username-overlay h1,
    #username-overlay p {
      font-family: 'Orbitron', sans-serif;
    }

    /* ---------- Game container ---------- */
    .game-container {
      position: relative;
      width: 90%;
      max-width: 100vw;
      aspect-ratio: 16 / 8;
      background: green;
      overflow: hidden;
      z-index: 3;
      border-radius: 8px;
    }

    /* ---------- Top HUD bar ---------- */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      color: white;
      padding: 8px 16px;
      font-family: sans-serif;
      font-size: 14px;
      user-select: none;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      z-index: 5;
    }

    /* ---------- Logo (left) ---------- */
    .logo-section {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: start;
      margin-right: auto;
      padding-left: 18px;
    }

    .logo-img {
      height: 30px;
      width: auto;
    }

    /* ---------- Leaderboard (center-left) ---------- */
    .leaderboard-section {
      display: flex;
      flex-direction: column;
      flex: 1;
      margin-left: 24px;
    }

    .leaderboard-title {
      margin-bottom: 8px;
      font-weight: 600;
    }

    .player-labels {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* ---------- Live count (right) ---------- */
    .live-section {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .live-label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
    }

    .live-dot-wrapper {
      position: relative;
      display: inline-flex;
      width: 10px;
      height: 10px;
    }

    .live-dot {
      position: relative;
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
    }

    .live-dot::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ef4444;
      animation: ping 1.4s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes ping {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }

      75%,
      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    .live-count {
      font-size: 24px;
      font-weight: bold;
    }

    .touch-controls {
      display: none;
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      padding: 0 16px;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 20;
      pointer-events: none;
    }

    .touch-controls button {
      pointer-events: auto;
    }

    .dpad {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .dpad-btn {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: none;
      background: rgba(174, 0, 0, 0.55);
      color: #ffe4e1;
      font-size: 16px;
      backdrop-filter: blur(2px);
    }

    .dpad-up {
      top: 0;
      left: 40px;
    }

    .dpad-left {
      top: 40px;
      left: 0;
    }

    .dpad-right {
      top: 40px;
      left: 80px;
    }

    .dpad-down {
      top: 80px;
      left: 40px;
    }

    .shoot-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(to bottom right, #ae0000, #7a0000);
      color: #ffe4e1;
      font-size: 24px;
      box-shadow: 0 0 0 3px rgba(174, 0, 0, 0.4);
    }

    /* only show on touch devices / mobile widths */
    @media (max-width: 760px),
    (pointer: coarse) {
      .touch-controls {
        display: flex;
      }
    }

    /* ---------- Username form ---------- */
    #username-overlay {
      display: flex;
      align-items: center;
      justify-content: start;
      flex-direction: column;
      gap: 8px;
      color: #ffe4e1;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
      backdrop-filter: blur(2px);
      background: linear-gradient(rgba(80, 0, 0, 0.55), rgba(40, 0, 0, 0.65));
    }

    .username-input {
      padding: 12px;
      border-radius: 20px;
      border: 1px solid rgba(174, 0, 0, 0.4);
      background: #5c1f1f;
      color: #f1c6c6;
    }

    input::placeholder {
      color: #d69a9a;
    }

    .start-btn {
      padding: 8px 20px;
      border-radius: 100px;
      border: none;
      background-image: linear-gradient(to right, #ae0000, #7a0000);
      color: #ffe4e1;
      cursor: pointer;
    }

    .start-btn-wrapper {
      text-align: center;
      margin-top: 8px;
    }

    @media (max-width: 980px) {
      .game-container {
        width: 90%;
        aspect-ratio: 1;
      }
    }

    @media (max-width: 760px) {
      .game-container {
        width: 100%;
        height: calc(100vh - 48px);
        aspect-ratio: unset;
      }

      body {
        padding: 0;
      }
    }

    @media (max-width: 480px) {
      .game-container {
        width: 100%;
        height: calc(100dvh - 44px);
        aspect-ratio: unset;
      }
    }

    /* ---------- Mobile responsiveness ---------- */
    @media (max-width: 640px) {
      .top-bar {
        font-size: 11px;
        padding: 6px 10px;
      }

      .logo-img {
        height: 20px;
      }

      .leaderboard-section {
        margin-left: 12px;
      }

      .live-count {
        font-size: 18px;
      }

      .username-input {
        max-width: 200px;
      }
    }
  </style>
</head>

<body>

  <div class="logo-section">
    <img src="./img/pixelarena_logo.svg" alt="PixelArena" class="logo-img" />
    <p class="logo-text">PixelArena</p>

  </div>
  <div class="game-container">
    <div class="top-bar">


      <div class="leaderboard-section">
        <div class="leaderboard-title">Leaderboard</div>
        <div id="playerLabels" class="player-labels"></div>
      </div>

      <div class="live-section">
        <p class="live-label">
          Live
          <span class="live-dot-wrapper">
            <span class="live-dot"></span>
          </span>
        </p>
        <div id="livePlayers" class="live-count">0</div>
      </div>
    </div>

    <canvas></canvas>
    <!-- add inside .game-container, after canvas -->
    <div class="touch-controls">
      <div class="dpad">
        <button class="dpad-btn dpad-up" data-dir="up">▲</button>
        <button class="dpad-btn dpad-left" data-dir="left">◀</button>
        <button class="dpad-btn dpad-right" data-dir="right">▶</button>
        <button class="dpad-btn dpad-down" data-dir="down">▼</button>
      </div>
      <button class="shoot-btn">🔫</button>
    </div>

    <!-- username input -->
    <div id="username-overlay">
      <h1>Welcome to PixelArena</h1>
      <p>Enter your username to start playing!</p>
      <form id="usernameForm">
        <div>
          <input id="usernameInput" type="text" placeholder="Username" class="username-input" />
        </div>
        <div class="start-btn-wrapper">
          <button class="start-btn">Start!</button>
        </div>
      </form>
    </div>
    <!-- username input end -->
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.2/gsap.min.js"
    integrity="sha512-kVlGhj2qFy+KBCFuvjBJTGUMxbdqJKs4yK2jh0e0VPhWUPiPC87bzm4THmaaIee3Oj7j6sDpTTgm2EPPiESqBg=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

  <script src="./js/classes/Enemy.js"></script>
  <script src="./js/classes/Player.js"></script>
  <script src="./js/classes/Particle.js"></script>
  <script src="./js/eventListeners.js"></script>
  <script src="./js/classes/Projectile.js"></script>
  <script src="./js/frontend.js"></script>
</body>

</html>
